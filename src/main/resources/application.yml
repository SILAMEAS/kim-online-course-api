server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 100MB # Max size for form data
    max-swallow-size: 100MB        # Max size Tomcat will swallow
    connection-timeout: 5m   # 10 minutes timeout
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB       # Max single file
      max-request-size: 100MB    # Max request
  jmx:
    enabled: false
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_lacy_restaurant}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:123}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:false}

logging:
  level:
    org.springframework.security: warn
    org.springframework.web.socket: trace

app:
  detail:
    name: "Online Course"
    version: "1.0.0"
    description: "API documentation's Online Course"
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  cors:
    allowed-origins:
      - http://localhost:3033
      - http://localhost:5005
      - http://localhost:3000
      - http://localhost:5000
      - https://lacy-restaurant.vercel.app
      - https://lacy.meassila.site